<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <meta charset="UTF-8">
        <title>cars list</title>
    </head>
    <body>
        <h1>cars list (show: [[${#lists.size(cars)}]])</h1>
        <table>
            <thead>
                <tr>
                    <th>model</th>
                    <th>year</th>
                    <th>color</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="car : ${cars}">
                    <td th:text="${car.model}">Model</td>
                    <td th:text="${car.year}">Year</td>
                    <td th:text="${car.color}">Color</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
